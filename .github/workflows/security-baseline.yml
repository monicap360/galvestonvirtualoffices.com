name: Security Baseline

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "53 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Block critical production advisories
        run: npm audit --omit=dev --audit-level=critical

  source-guardrails:
    name: Tracked-secret guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked environment files and high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail

          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(example|sample|template)$' || true)"
          if [[ -n "$tracked_env" ]]; then
            echo "Tracked environment files are prohibited:"
            printf '%s\n' "$tracked_env"
            exit 1
          fi

          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "private key": re.compile(rb"-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "AWS access key": re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(rb"\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{70,})\b"),
              "OpenAI token": re.compile(rb"\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}\b"),
              "Anthropic token": re.compile(rb"\bsk-ant-[A-Za-z0-9_-]{32,}\b"),
              "Supabase secret key": re.compile(rb"\bsb_secret_[A-Za-z0-9_-]{20,}\b"),
              "Stripe live key": re.compile(rb"\b(?:sk|rk)_live_[A-Za-z0-9]{20,}\b"),
          }

          offenders = []
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in files:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", "surrogateescape"))
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      offenders.append(f"{path}: {label}")

          if offenders:
              print("High-confidence secret material is tracked:", file=sys.stderr)
              print("\n".join(f"- {item}" for item in offenders), file=sys.stderr)
              sys.exit(1)

          print("Tracked-secret guardrails: ok")
          PY
