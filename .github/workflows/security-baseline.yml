name: Security Baseline

on:
  pull_request:
    paths:
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "src/app/api/**"
      - "src/lib/**"
      - "supabase/**"
      - "migrations/**"
      - "middleware.*"
      - "next.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out reviewed code without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Block high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build the production Next.js application
        run: npm run build
