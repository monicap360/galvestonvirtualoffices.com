name: AI Studio checks

on:
  pull_request:
    paths:
      - "src/app/ai-studio/**"
      - "src/app/dashboard/agents/**"
      - "src/app/dashboard/layout.tsx"
      - "src/lib/ai-studio/**"
      - "scripts/tests/ai-*.test.mjs"
      - "scripts/tests/my-ai-agents-dashboard.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-studio-checks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npm run test:ai-studio
      - run: npm run lint
      - run: npm run build
