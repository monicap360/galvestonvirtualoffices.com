# Render deployment config for Galveston Virtual Offices (Next.js 16)
# Render → New → Blueprint (or Web Service) → connect this repo.
services:
  - type: web
    name: galvestonvirtualoffices
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Public values (publishable/anon key ships in the browser — safe to commit)
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://pljqnaxowvhkzyeybqal.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_IxytxErVh-M73nUld5sQgA_LNRfdKQ0
      - key: NEXT_PUBLIC_DEFAULT_TENANT
        value: galveston
      - key: GMAIL_USER
        value: cruisesfromgalveston.texas@gmail.com
      - key: RESERVATION_NOTIFY_EMAIL
        value: cruisesfromgalveston.texas@gmail.com
      # Secrets — set these in the Render dashboard, never commit them
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
